version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "${ZK_PORT}:${ZK_PORT}"
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZK_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ${KAFKA_DATA_DIR}/zookeeper:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZK_PORT}
      # Listeners configurados para Docker interno y host
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  kafka-connect:
    image: confluentinc/cp-kafka-connect:latest
    container_name: kafka-connect
    depends_on:
      - kafka
      - schema-registry

    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:9092"
      CONNECT_LISTENERS: "http://0.0.0.0:8084"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_REST_PORT: 8084
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_GROUP_ID: "kafka-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect-status"

      # JDBC Sink config
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_JDBC_URL: "jdbc:postgresql://postgresql:5432/${PG_DB}"
      CONNECT_JDBC_USER: "${PG_USER}"
      CONNECT_JDBC_PASSWORD: "${PG_PASSWORD}"
      CONNECT_JDBC_DRIVER_CLASS: "org.postgresql.Driver"
      CONNECT_TABLE_NAME_FORMAT: "my_table"
      CONNECT_INSERT_MODE: "upsert"

      # Converters
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"

      # Si usaras Avro:
      # CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      # CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"

    ports:
      - "8084:8084"
    restart: unless-stopped


  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      # Configuración de clúster de Kafka para la UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:${ZK_PORT}"
      KAFKA_CLUSTERS_0_NAME: "paysim-cluster"
      # Opcional: si quieres habilitar autenticación simple:
      # KAFKA_UI_AUTH_ENABLED: "true"
      # KAFKA_UI_USERNAME: "admin"
      # KAFKA_UI_PASSWORD: "admin123"
    ports:
      - "8085:8080"  # Kafka UI expuesto en 8085 local
    depends_on:
      - kafka
      - zookeeper
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.2
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "${SPARK_MASTER_PORT}:${SPARK_MASTER_PORT}"
      - "8083:8080"  # Spark Master UI
    volumes:
      - ${SPARK_MASTER_LOGS}:/opt/spark/logs
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.2
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:${SPARK_MASTER_PORT}"]
    depends_on:
      - spark-master
    volumes:
      - ${SPARK_WORKER_LOGS}:/opt/spark/logs
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - ${MONGO_DATA_DIR}:/data/db
    restart: unless-stopped


  postgresql:
    image: postgres:13
    container_name: postgresql
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "${PG_PORT}:${PG_PORT}"
    volumes:
      - ${PG_DATA_DIR}:/var/lib/postgresql/data
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "8082:80"  # Exponemos el puerto 8082 para pgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
    depends_on:
      - postgresql
    volumes:
      - pgadmin-data:/var/lib/pgadmin


volumes:
  spark_master:
  spark_worker:
  mongo:
  kafka:
  pgadmin-data:
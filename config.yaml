# ===================================================================
# CONFIGURACION GLOBAL DEL PROYECTO
# Sistema de deteccion de fraude en tiempo real
# ===================================================================

# ---------------------------------------------------
#  Rutas de datos del Data Lake (Medallion Architecture)
# ---------------------------------------------------
paths:

  # -------------------------------
  # Carpeta general de logs
  # -------------------------------
  logs:
    root: "logs/"

  # -------------------------------
  # Capa RAW (entrada original)
  # -------------------------------
  data_raw:
    root: "data/raw/"

    datasets:
      root: "data/raw/datasets/"
      paysim: "data/raw/datasets/PaySim1.csv"

  # -------------------------------
  # Capa BRONZE (datos limpiados sin transformar)
  # -------------------------------
  data_bronze:
    root: "data/bronze/"
    paysim_cash_in_parquet: "data/bronze/paysim_cash_in.parquet"
    paysim_cash_out_parquet: "data/bronze/paysim_cash_out.parquet"
    paysim_debit_parquet: "data/bronze/paysim_debit.parquet"
    paysim_payment_parquet: "data/bronze/paysim_payment.parquet"
    paysim_transfer_parquet: "data/bronze/paysim_transfer.parquet"

  # -------------------------------
  # Capa SILVER (datos transformados / agregados)
  # -------------------------------
  data_silver:
    root: "data/silver/"

  # -------------------------------
  # Capa GOLD (datos para consumo final / BI / ML)
  # -------------------------------
  data_gold:
    root: "data/gold/"

  # -------------------------------
  # Rutas de scripts SQL para PostgreSQL
  # -------------------------------
  postgresql_sql:
    create_tables: "src/fraud_detection/postgresql/create_tables.sql"
    init_data: "src/fraud_detection/postgresql/init_data.sql"


# ---------------------------------------------------
#  Configuración de Logging global
# ---------------------------------------------------
logging:
  level: "INFO"
  logs_dir: "logs"
  producer_log: "logs/producer/producer.log"
  spark_log: "logs/spark/structured_streaming.log"
  api_log: "logs/api/api_access.log"

# ---------------------------------------------------
#  Configuración del Generador de Transacciones (Producer)
# ---------------------------------------------------

# ---------------------------------------------------
#  Configuración de Kafka
# ---------------------------------------------------
kafka:
  broker: "PLAINTEXT://localhost:29092"
  zookeeper: "${KAFKA_ZOOKEEPER_CONNECT}"
  topics:
    - "paysim_cash_in"
    - "paysim_cash_out"
    - "paysim_debit"
    - "paysim_payment"
    - "paysim_transfer"


  schema_registry:
    payment_schema: "src/fraud_detection/schemas/payment_schema.avsc"
    transfer_schema: "src/fraud_detection/schemas/transfer_schema.avsc"
    cash_out_schema: "src/fraud_detection/schemas/cash_out_schema.avsc"
    cash_in_schema: "src/fraud_detection/schemas/cash_in_schema.avsc"
    debit_schema: "src/fraud_detection/schemas/debit_schema.avsc"  # Asegúrate de incluirlo aquí
# ---------------------------------------------------
#  Configuración de Spark Structured Streaming
# ---------------------------------------------------

# ---------------------------------------------------
#  Configuración de PostgreSQL
# ---------------------------------------------------
postgresql:
  host: "postgresql"  # El nombre del servicio definido en Docker Compose
  port: "${PG_PORT}"
  user: "${PG_USER}"
  password: "${PG_PASSWORD}"
  database: "${PG_DB}"
